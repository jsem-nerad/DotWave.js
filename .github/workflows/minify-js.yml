name: Auto Minify JS Files

on:
  push:
    paths:
      - 'src/**'

permissions:
  contents: write  # Required to push changes

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Minify JS files
        uses: docker://devatherock/minify-js@sha256:cca5837fabfe5d11d8e751080f9a0de838ebfc58e6fc382c421a22d751b075c0
        with:
          directory: 'src'
          add_suffix: true
          inclusions: |-
            .*\.js$

      - name: Commit minified files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-minify JS files in /src directory"
